<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Clavis Logo — Option A Refined</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e0e0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 56px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 60px 40px;
  }
  .section-title {
    color: rgba(255,255,255,0.22);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
    text-align: center;
    margin-bottom: 28px;
  }
  .row {
    display: flex;
    align-items: flex-end;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .chip-label {
    color: rgba(255,255,255,0.2);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .divider {
    width: 1px;
    height: 80px;
    background: rgba(255,255,255,0.07);
    align-self: center;
  }
  .on-app {
    background: #1c1c1e;
    border-radius: 20px;
    padding: 28px 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(255,255,255,0.07);
  }
  .app-name {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #f5f5f5;
  }
  .app-name span { color: #e8b84b; }
</style>
</head>
<body>

<!-- ─── Icon sizes ──────────────────────────────────── -->
<div>
  <div class="section-title">App icon — all sizes</div>
  <div class="row">

    <div class="chip">
      <!-- 512px — main icon SVG -->
      <svg width="220" height="220" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2c2c2e"/>
            <stop offset="100%" stop-color="#1a1a1b"/>
          </linearGradient>
          <radialGradient id="shine" cx="28%" cy="22%" r="52%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.07)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
          <linearGradient id="gold" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#f5cb6a"/>
            <stop offset="100%" stop-color="#d49530"/>
          </linearGradient>
          <mask id="key">
            <!-- Bow ring: outer -->
            <circle cx="187" cy="254" r="107" fill="white"/>
            <!-- Bow ring: hole -->
            <circle cx="187" cy="254" r="61" fill="black"/>
            <!-- Shaft — flows out from bow, rounded tip on right -->
            <rect x="246" y="232" width="200" height="44" rx="22" fill="white"/>
            <!-- Tooth 1: taller, left -->
            <rect x="354" y="276" width="42" height="58" rx="11" fill="white"/>
            <!-- Tooth 2: shorter, right -->
            <rect x="408" y="276" width="30" height="42" rx="9" fill="white"/>
          </mask>
        </defs>
        <!-- BG -->
        <rect width="512" height="512" rx="114" fill="url(#bg)"/>
        <rect width="512" height="512" rx="114" fill="url(#shine)"/>
        <!-- Key -->
        <rect width="512" height="512" fill="url(#gold)" mask="url(#key)"/>
      </svg>
      <div class="chip-label">512 × 512</div>
    </div>

    <div class="divider"></div>

    <div class="chip">
      <svg width="96" height="96" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2c2c2e"/>
            <stop offset="100%" stop-color="#1a1a1b"/>
          </linearGradient>
          <linearGradient id="gold2" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#f5cb6a"/>
            <stop offset="100%" stop-color="#d49530"/>
          </linearGradient>
          <mask id="key2">
            <circle cx="187" cy="254" r="107" fill="white"/>
            <circle cx="187" cy="254" r="61" fill="black"/>
            <rect x="246" y="232" width="200" height="44" rx="22" fill="white"/>
            <rect x="354" y="276" width="42" height="58" rx="11" fill="white"/>
            <rect x="408" y="276" width="30" height="42" rx="9" fill="white"/>
          </mask>
        </defs>
        <rect width="512" height="512" rx="114" fill="url(#bg2)"/>
        <rect width="512" height="512" fill="url(#gold2)" mask="url(#key2)"/>
      </svg>
      <div class="chip-label">96 × 96</div>
    </div>

    <div class="chip">
      <svg width="64" height="64" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2c2c2e"/>
            <stop offset="100%" stop-color="#1a1a1b"/>
          </linearGradient>
          <linearGradient id="gold3" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#f5cb6a"/>
            <stop offset="100%" stop-color="#d49530"/>
          </linearGradient>
          <mask id="key3">
            <circle cx="187" cy="254" r="107" fill="white"/>
            <circle cx="187" cy="254" r="61" fill="black"/>
            <rect x="246" y="232" width="200" height="44" rx="22" fill="white"/>
            <rect x="354" y="276" width="42" height="58" rx="11" fill="white"/>
            <rect x="408" y="276" width="30" height="42" rx="9" fill="white"/>
          </mask>
        </defs>
        <rect width="512" height="512" rx="114" fill="url(#bg3)"/>
        <rect width="512" height="512" fill="url(#gold3)" mask="url(#key3)"/>
      </svg>
      <div class="chip-label">64 × 64</div>
    </div>

    <div class="chip">
      <svg width="48" height="48" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2c2c2e"/>
            <stop offset="100%" stop-color="#1a1a1b"/>
          </linearGradient>
          <linearGradient id="gold4" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#f5cb6a"/>
            <stop offset="100%" stop-color="#d49530"/>
          </linearGradient>
          <mask id="key4">
            <circle cx="187" cy="254" r="107" fill="white"/>
            <circle cx="187" cy="254" r="61" fill="black"/>
            <rect x="246" y="232" width="200" height="44" rx="22" fill="white"/>
            <rect x="354" y="276" width="42" height="58" rx="11" fill="white"/>
            <rect x="408" y="276" width="30" height="42" rx="9" fill="white"/>
          </mask>
        </defs>
        <rect width="512" height="512" rx="114" fill="url(#bg4)"/>
        <rect width="512" height="512" fill="url(#gold4)" mask="url(#key4)"/>
      </svg>
      <div class="chip-label">48 × 48</div>
    </div>

  </div>
</div>

<!-- ─── Wordmark ────────────────────────────────────── -->
<div>
  <div class="section-title">Wordmark — in app header</div>
  <div class="row">
    <div class="on-app">
      <!-- Inline key mark, scaled down to header height -->
      <svg width="32" height="32" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2c2c2e"/>
            <stop offset="100%" stop-color="#1a1a1b"/>
          </linearGradient>
          <linearGradient id="gold5" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#f5cb6a"/>
            <stop offset="100%" stop-color="#d49530"/>
          </linearGradient>
          <mask id="key5">
            <circle cx="187" cy="254" r="107" fill="white"/>
            <circle cx="187" cy="254" r="61" fill="black"/>
            <rect x="246" y="232" width="200" height="44" rx="22" fill="white"/>
            <rect x="354" y="276" width="42" height="58" rx="11" fill="white"/>
            <rect x="408" y="276" width="30" height="42" rx="9" fill="white"/>
          </mask>
        </defs>
        <rect width="512" height="512" rx="114" fill="url(#bg5)"/>
        <rect width="512" height="512" fill="url(#gold5)" mask="url(#key5)"/>
      </svg>
      <div class="app-name">Cla<span>vis</span></div>
    </div>

    <!-- Just the wordmark, text only, no icon -->
    <div class="on-app">
      <div class="app-name">Cla<span>vis</span></div>
    </div>
  </div>
</div>

<!-- ─── On white (light context) ────────────────────── -->
<div>
  <div class="section-title">On light background</div>
  <div class="row">
    <div style="background:#f5f5f5; border-radius:20px; padding:24px;">
      <svg width="96" height="96" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2c2c2e"/>
            <stop offset="100%" stop-color="#1a1a1b"/>
          </linearGradient>
          <linearGradient id="gold6" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#f5cb6a"/>
            <stop offset="100%" stop-color="#d49530"/>
          </linearGradient>
          <mask id="key6">
            <circle cx="187" cy="254" r="107" fill="white"/>
            <circle cx="187" cy="254" r="61" fill="black"/>
            <rect x="246" y="232" width="200" height="44" rx="22" fill="white"/>
            <rect x="354" y="276" width="42" height="58" rx="11" fill="white"/>
            <rect x="408" y="276" width="30" height="42" rx="9" fill="white"/>
          </mask>
        </defs>
        <rect width="512" height="512" rx="114" fill="url(#bg6)"/>
        <rect width="512" height="512" fill="url(#gold6)" mask="url(#key6)"/>
      </svg>
    </div>
  </div>
</div>

</body>
</html>
